<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Login – Task Manager</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

<main class="auth-wrap">
  <div class="auth-card">
    <h1>📚 Student Task Manager</h1>
    <p class="auth-sub">Track tasks, subjects and attendance in one place.</p>

    <div class="auth-tabs" role="tablist">
      <button type="button" id="tab-login" class="auth-tab is-active" role="tab" aria-selected="true">Log in</button>
      <button type="button" id="tab-register" class="auth-tab" role="tab" aria-selected="false">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="login-form" novalidate>
      <div class="form-row">
        <label for="login-roll">Roll number / Student ID</label>
        <input type="text" id="login-roll" autocomplete="username" placeholder="e.g. 21CS045" required>
      </div>
      <div class="form-row">
        <label for="login-pass">Password</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </div>
      <p class="error" id="login-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <!-- REGISTER -->
    <form id="register-form" novalidate hidden>
      <div class="form-row">
        <label for="reg-name">Full name</label>
        <input type="text" id="reg-name" autocomplete="name" maxlength="60" required>
      </div>
      <div class="form-row">
        <label for="reg-roll">Roll number / Student ID</label>
        <input type="text" id="reg-roll" autocomplete="username" maxlength="30" required>
      </div>
      <div class="form-row">
        <label for="reg-pass">Password (min 6 characters)</label>
        <input type="password" id="reg-pass" autocomplete="new-password" required>
      </div>
      <div class="form-row">
        <label for="reg-pass2">Confirm password</label>
        <input type="password" id="reg-pass2" autocomplete="new-password" required>
      </div>
      <p class="error" id="register-error" hidden></p>
      <button type="submit" class="btn btn-primary btn-block">Create account</button>
    </form>

    <p class="auth-note">Accounts are stored in this browser only.</p>
  </div>
</main>

<script src="js/storage.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
